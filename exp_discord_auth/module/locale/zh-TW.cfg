


[exp-discord-auth]
linked = 你的帳號現在已連結至 Discord 帳號 __1__。
linked-to = 你的帳號已連結至 Discord 帳號 __1__。使用 /unlink-discord 將其移除。
unlinked = 你的帳號已不再連結至 Discord 帳號 __1__。
not-linked = 你的帳號尚未連結至 Discord 帳號。請在 __1__ 使用 Discord 登入以取得代碼，然後使用 /link-discord <code>。

[exp-discord-auth_commands]
description-link = 使用網站上的代碼將你的帳號連結至 Discord，或顯示你已連結的帳號。
description-unlink = 移除你的帳號與 Discord 之間的連結。
arg-code = 使用 Discord 登入後，網站上顯示的代碼。