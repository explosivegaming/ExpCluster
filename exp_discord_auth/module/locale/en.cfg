[exp-discord-auth]
linked=Your account is now linked to the Discord account __1__.
linked-to=Your account is linked to the Discord account __1__. Use /unlink-discord to remove it.
unlinked=Your account is no longer linked to the Discord account __1__.
not-linked=Your account is not linked to a Discord account. Log in with Discord at __1__ to get a code, then use /link-discord <code>.

[exp-discord-auth_commands]
description-link=Links your account to Discord using the code from the website, or shows the account you are linked to.
description-unlink=Removes the link between your account and Discord.
arg-code=Code shown on the website after logging in with Discord.
